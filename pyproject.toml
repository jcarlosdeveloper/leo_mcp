# Leo MCP - Build System Configuration (PEP 517 / PEP 621)
# https://packaging.python.org/en/latest/specifications/pyproject-toml/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================
# PROJECT METADATA
# ============================================

[project]
name = "leo-mcp-server"
version = "10.0.0"
description = "MCP Bridge Server for Brave Leo AI - CDP integration, streaming, SQLite polling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

authors = [
    { name = "Juan Carlos Duarte", email = "juan@duarte.dev" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

keywords = [
    "mcp",
    "brave",
    "leo",
    "ai",
    "streaming",
    "web-scraping",
    "playwright",
    "async",
]

# ============================================
# DEPENDENCIES
# ============================================

dependencies = [
    # Core MCP
    "mcp>=1.28.0",
    
    # Web scraping
    "playwright>=1.60.0",
    
    # Async HTTP
    "httpx>=0.28.0",
    "httpx-sse>=0.4.3",
    "anyio>=4.14.0",
    
    # Validation & settings
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",
    
    # Server
    "uvicorn>=0.49.0",
    "starlette>=1.3.0",
    "sse-starlette>=3.4.0",
    
    # Utilities
    "typing-extensions>=4.15.0",

    # Crypto (Leo Keychain decryption)
    "pycryptodome>=3.23.0",
]

# Optional dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

# Entry points - ejecutar directamente: python3 leo_mcp_server.py
# No hay CLI wrapper, el server se runnea in-place
# [project.scripts]
# leo-mcp = "leo_mcp_server:main"  # Removido - no hay función main()

[project.urls]
Homepage = "https://github.com/tu-usuario/leo-mcp"
Repository = "https://github.com/tu-usuario/leo-mcp.git"
Issues = "https://github.com/tu-usuario/leo-mcp/issues"
Documentation = "https://github.com/tu-usuario/leo-mcp#readme"

# ============================================
# TOOLS CONFIGURATION
# ============================================

# --- Ruff (Linting & Formatting) ---
# Reemplaza: flake8, isort, black, pyupgrade
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize syntax)
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (ruff format maneja esto)
    "B008",  # function calls in default args (common in async)
    "B904",  # raise without from (acceptable in error handling)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]  # Allow assert in tests
"*.ipynb" = ["E402"]     # Allow imports after code in notebooks

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- pytest (Testing) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short --strict-markers --color=yes"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests (require Brave)",
    "streaming: marks streaming tests",
    "playwright: marks tests requiring Playwright",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# --- mypy (Type Checking) ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
files = ["leo_mcp_server.py", "leo_chat/**/*.py"]
exclude = ["tests/", "legacy/"]

# mypy per-module overrides
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false

# --- Coverage ---
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --- uv (Python package manager - optional) ---
# https://docs.astral.sh/uv/
[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

# ============================================
# NOTES
# ============================================
# 
# Migration checklist:
# ✓ pyproject.toml created (PEP 621 compliant)
# ⏳ Move requirements.txt → requirements.lock (or delete if using uv)
# ⏳ Run: pip install -e ".[dev]"
# ⏳ Run: ruff check --fix .
# ⏳ Run: ruff format .
# ⏳ Run: pytest
# ⏳ Run: mypy .
# 
# Commands:
#   Install:        pip install -e .
#   Install dev:    pip install -e ".[dev]"
#   Lint:           ruff check .
#   Auto-fix:       ruff check --fix .
#   Format:         ruff format .
#   Test:           pytest
#   Type check:     mypy .
#   Coverage:       pytest --cov=. --cov-report=html
#
# With uv (recommended, 10-100x faster):
#   Install uv:     curl -LsSf https://astral.sh/uv/install.sh | sh
#   Sync:           uv pip sync requirements.txt
#   Lock:           uv pip compile pyproject.toml -o requirements.txt
#   Install dev:    uv pip install -e ".[dev]"

[tool.hatch.build.targets.wheel]
packages = ["leo_chat", "brave_search", "utils"]